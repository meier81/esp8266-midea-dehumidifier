[platformio]
src_dir = .

[env:esp01]
platform = espressif8266@2.6.3
board = esp01_1m
framework = arduino

board_build.ldscript = eagle.flash.1m64.ld

lib_deps =
    bblanchon/ArduinoJson@6.10.1
    knolleary/PubSubClient@2.8.0
    tzapu/WiFiManager@0.15.0

monitor_speed = 115200

upload_protocol = espota
