[platformio]
src_dir = .

[env:esp01]
platform = espressif8266@2.6.3
board = esp01_1m
framework = arduino

board_build.ldscript = eagle.flash.1m64.ld

lib_deps =
    bblanchon/ArduinoJson@6.10.1
    knolleary/PubSubClient@2.8.0
    tzapu/WiFiManager@0.15.0

monitor_speed = 115200

# OTA-Update über WLAN:
# upload_port: IP-Adresse des Entfeuchters im eigenen Netzwerk eintragen.
#              192.168.0.1 ist nur ein Beispiel und muss ggf. angepasst werden.
# upload_flags: XXXXXX durch die sechsstellige ESP8266-Chip-ID ersetzen.
#               Das OTA-Passwort entspricht dem Hostnamen dehumidifier_XXXXXX.
# Die Chip-ID bzw. den Hostnamen in der Weboberfläche des Geräts ablesen.
upload_protocol = espota
upload_port = 192.168.0.1
upload_flags =
    --auth=dehumidifier_XXXXXX
